services:
  postgres:
    image: postgres:15-alpine
    container_name: cevo-db
    environment:
      POSTGRES_USER: cevo_user
      POSTGRES_PASSWORD: cevo_pass
      POSTGRES_DB: cevo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cevo_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
